name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Format, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --no-default-features --all-targets -- -D warnings
      - run: cargo test --lib

  rabbitmq:
    name: Integration tests (RabbitMQ)
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: hypermq
          RABBITMQ_DEFAULT_PASS: change-me
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
    env:
      HYPERMQ_TEST_RABBITMQ_URL: amqp://hypermq:change-me@localhost:5672
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test rabbitmq -- --ignored

  outbox:
    name: Integration tests (outbox: PostgreSQL and MySQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hypermq
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: hypermq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hypermq -d hypermq"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root-change-me
          MYSQL_USER: hypermq
          MYSQL_PASSWORD: change-me
          MYSQL_DATABASE: hypermq
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u hypermq -pchange-me"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      HYPERMQ_TEST_POSTGRES_URL: postgres://hypermq:change-me@localhost:5432/hypermq
      HYPERMQ_TEST_MYSQL_URL: mysql://hypermq:change-me@localhost:3306/hypermq
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test outbox -- --ignored

  image:
    name: Container image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hypermq:ci .
