[package]
name = "hypermq"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
bytes = "1.12.1"
chrono = "0.4"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-lite = "2.6.1"
humantime-serde = "1.1.1"
lapin = "4.12.3"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"], optional = true }
reqwest = { version = "0.13.5", optional = true }
sea-orm = { version = "2.0.4", default-features = false, features = ["macros", "runtime-tokio-rustls", "with-chrono", "with-uuid"], optional = true }
sea-orm-migration = { version = "2.0.4", default-features = false, features = ["runtime-tokio-rustls"], optional = true }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = { version = "2.5.8", optional = true }
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = "0.5.3"

[features]
default = ["task-http", "task-amqp", "task-email", "outbox-postgres", "outbox-mysql"]
task-http = ["dep:reqwest"]
task-amqp = ["dep:url"]
task-email = ["dep:lettre"]
outbox = ["dep:sea-orm", "dep:sea-orm-migration"]
outbox-postgres = ["outbox", "sea-orm/sqlx-postgres", "sea-orm-migration/sqlx-postgres"]
outbox-mysql = ["outbox", "sea-orm/sqlx-mysql", "sea-orm-migration/sqlx-mysql"]
