# Illustrative config; the format is not final (see "Open design questions" in AGENTS.md).
# Values are plain text: HyperMQ does not expand variables. Provide the real file at deploy time
# (for example from a secret mount) and keep it out of version control.

broker:
  url: amqp://hypermq:change-me@localhost:5672

http_api:
  bind: 0.0.0.0:8080
  max_body_bytes: 1048576
  # Optional. When set, POST /publish requires `Authorization: Bearer <token>`. Keep the real value out of version control.
  # bearer_token: change-me

# Declared at startup (exchanges, then queues, then bindings). Re-declaring identical settings is a
# no-op; a conflicting existing entity fails startup. `durable` defaults to true. Optional queue
# settings: dead_letter_exchange, dead_letter_routing_key, message_ttl (for example 30s).
topology:
  exchanges:
    - name: orders
      kind: topic
      durable: true
    - name: orders.dlx
      kind: fanout
      durable: true
  queues:
    - name: orders.created
      durable: true
      dead_letter_exchange: orders.dlx
    - name: orders.created.dead
      durable: true
    - name: orders.created.email
      durable: true
      dead_letter_exchange: orders.dlx
  bindings:
    - queue: orders.created
      exchange: orders
      routing_key: order.created
    - queue: orders.created.email
      exchange: orders
      routing_key: order.created
    - queue: orders.created.dead
      exchange: orders.dlx
      routing_key: ""

consumers:
  - name: notify-billing
    queue: orders.created
    prefetch: 10
    timeout: 10s          # per-message limit on the Task; a timeout is retryable
    retry:
      max_attempts: 5
      base_delay: 5s
      backoff: exponential
      max_delay: 5m
    task:
      type: http
      method: POST
      url: https://billing.internal.example.com/api/orders
      allowed_hosts:
        - billing.internal.example.com   # the only hosts the URL may target; required
      headers:
        Authorization: Bearer change-me
      idempotency_header: Idempotency-Key   # filled with the stable message id

  - name: archive-dead-orders
    queue: orders.created.dead
    prefetch: 5
    timeout: 10s
    retry:
      max_attempts: 3
      base_delay: 5s
      backoff: exponential
      max_delay: 1m
    task:
      type: amqp
      url: amqp://archive:change-me@archive.internal.example.com:5672/
      allowed_hosts:
        - archive.internal.example.com   # the only hosts the URL may target; required
      exchange: orders.archive           # set exactly one of exchange or queue
      routing_key: dead.order            # exchange targets only

  - name: notify-customer
    queue: orders.created.email
    prefetch: 5
    timeout: 30s
    retry:
      max_attempts: 5
      base_delay: 5s
      backoff: exponential
      max_delay: 5m
    task:
      type: email
      host: smtp.example.com
      port: 587                        # defaults: 587 for starttls, 465 for tls, 25 for plaintext
      tls: starttls                    # starttls (default), tls, or plaintext
      username: orders@example.com
      password: change-me              # keep the real password out of version control
      from: HyperMQ <orders@example.com>
      to:
        - ops@example.com
      subject: New order
      allowed_hosts:
        - smtp.example.com             # the only hosts the SMTP server may be; required

# Optional. Publishes that RabbitMQ cannot take (broker down or publish failed) are stored here and
# relayed later. Use postgres:// for development. Keep the real URL out of version control.
outbox:
  database_url: postgres://hypermq:change-me@localhost:5433/hypermq
  max_messages: 100000   # publishes return 503 when this many rows wait
  max_age: 24h           # older rows move to the dead-letter table
  cooldown: 5s           # pause between relay cycles
  max_attempts: 10       # failed publishes of an unroutable message before dead-lettering
  retry_base_delay: 1s
  retry_max_delay: 5m
  degraded_after: 5m     # /health reports degraded when the oldest row is older than this
